[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recon13"
version = "0.2.0"
description = "Lightweight reconnaissance toolkit for authorized security research."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Pa7rsa"}]
license = {file = "LICENSE"}
keywords = ["security", "reconnaissance", "bug-bounty", "dns", "http", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.31,<3",
  "dnspython>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
13recon = "recon13.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
